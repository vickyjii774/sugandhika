name: Django backend checks

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/django-backend.yml"
  push:
    branches: ["feat/django-backend-migration"]
    paths:
      - "backend/**"
      - ".github/workflows/django-backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Create local migrations for validation
        run: python manage.py makemigrations catalog
      - name: Print generated migration for review
        run: cat catalog/migrations/0001_initial.py
      - name: Apply migrations
        run: python manage.py migrate --noinput
      - name: Run Django system checks
        run: python manage.py check
      - name: Run API tests
        run: python manage.py test catalog --verbosity 2
