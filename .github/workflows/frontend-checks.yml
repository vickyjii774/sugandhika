name: Frontend checks

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "package.json"
      - "package-lock.json"
      - "prisma/**"
      - "tsconfig.json"
      - ".github/workflows/frontend-checks.yml"
  push:
    branches: ["feat/django-backend-migration"]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "package.json"
      - "package-lock.json"
      - "prisma/**"
      - "tsconfig.json"
      - ".github/workflows/frontend-checks.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: TypeScript check
        run: npx tsc --noEmit
