services:
  - type: web
    name: sugandhika-django-staging
    runtime: docker
    plan: free
    region: singapore
    branch: feat/django-backend-migration
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health/
    autoDeployTrigger: off
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: sugandhika-django-staging.onrender.com
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: sugandhika-staging-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:3000
      - key: CSRF_TRUSTED_ORIGINS
        value: https://sugandhika-django-staging.onrender.com

databases:
  - name: sugandhika-staging-db
    databaseName: sugandhika_staging
    user: sugandhika_staging_user
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    ipAllowList: []
